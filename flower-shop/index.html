<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>小花店物语 · 包花小游戏</title>
<meta name="description" content="在街角经营一家安静的小花店：听客人说想要什么花，挑花、选包装纸，慢慢包好一束花。" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💐</text></svg>" />
<style>
  :root {
    --ink: #2b231e;
    --ink-2: #5b4d44;
    --sub: #8c7d72;
    --bg: #efe6d6;
    --cream: #fff8e8;
    --butter: #fff1cc;
    --line: #e6d7bf;
    --sage: #8fa98a;
    --sage-d: #6f8b6b;
    --wood: #c39467;
    --wood-d: #a57a50;
    --rose: #e0564a;
    --peach: #f19a6b;
    --gold: #e7a83a;
    --r: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  .game { max-width: 460px; margin: 0 auto; padding: 10px 12px 22px; }

  /* HUD */
  .hud { display: flex; align-items: center; gap: 8px; }
  .hud-day { background: var(--ink); color: var(--butter); border-radius: 14px; padding: 6px 12px; font-weight: 900; font-size: 15px; white-space: nowrap; letter-spacing: .5px; }
  .hud-time { flex: 1; background: var(--cream); border-radius: 14px; padding: 7px 10px; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 0 var(--line); }
  .hud-time span { font-size: 11px; color: var(--ink-2); font-weight: 700; white-space: nowrap; }
  .timebar { flex: 1; height: 8px; border-radius: 99px; background: #eadcc4; overflow: hidden; }
  .timebar i { display: block; height: 100%; width: 100%; border-radius: 99px; background: linear-gradient(90deg, #f3c467, #ef8f5b); transition: width .25s linear; }
  .hud-pill { background: var(--cream); border-radius: 14px; padding: 6px 10px; font-size: 14px; font-weight: 900; white-space: nowrap; box-shadow: 0 2px 0 var(--line); color: var(--ink); }
  .hud-pill small { font-size: 10px; color: var(--sub); font-weight: 700; margin-right: 2px; }
  .hud-btn { width: 34px; height: 34px; border-radius: 12px; background: var(--cream); box-shadow: 0 2px 0 var(--line); font-size: 13px; flex: none; color: var(--ink); font-weight: 900; }
  .goal { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-2); margin: 7px 4px 0; font-weight: 600; }
  .goal b { color: var(--ink); }

  /* 场景 */
  .scene { position: relative; margin-top: 10px; border-radius: 24px; overflow: hidden; aspect-ratio: 390 / 250; box-shadow: 0 6px 18px rgba(80, 58, 34, .14); background: #f5eee1; }
  .scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene .front { pointer-events: none; }
  .scene .front .tap { pointer-events: auto; cursor: pointer; }
  .scene .back .tap { cursor: pointer; }
  .people { position: absolute; inset: 0; pointer-events: none; }
  .person {
    position: absolute; bottom: 22%; width: 15%; transform: translateX(-50%);
    transition: left 1.1s ease-in-out, opacity .5s; pointer-events: auto; cursor: pointer;
  }
  .person svg { width: 100%; display: block; }
  .person.walking svg { animation: bob .36s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-3%); } }
  .person .ptop { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); width: 120%; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .pbar { width: 70%; height: 4px; border-radius: 99px; background: rgba(43, 35, 30, .12); overflow: hidden; }
  .pbar i { display: block; height: 100%; border-radius: 99px; transition: width .25s linear, background .3s; }
  .person.arriving .pbar { opacity: 0; }
  .mood {
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) scale(0); transform-origin: 50% 100%;
    background: var(--cream); color: var(--ink); border-radius: 10px; padding: 3px 7px; font-size: 10px; font-weight: 800; white-space: nowrap;
    box-shadow: 0 2px 6px rgba(60, 40, 20, .18); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
  }
  .mood.show { transform: translateX(-50%) scale(1); }
  .person .marker { position: absolute; left: 50%; top: -2px; width: 0; height: 0; transform: translateX(-50%); opacity: 0; transition: opacity .2s;
    border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 6px solid var(--rose); }
  .person.sel .marker { opacity: 1; animation: hop 1.2s ease-in-out infinite; }
  @keyframes hop { 50% { transform: translate(-50%, -3px); } }
  .person.sel svg .halo { opacity: 1; }

  .dust { animation: drift 7s ease-in-out infinite; }
  @keyframes drift {
    0% { transform: translate(0, 0); opacity: 0; }
    20% { opacity: .9; }
    80% { opacity: .7; }
    100% { transform: translate(18px, 42px); opacity: 0; }
  }
  .beam { animation: beam 6s ease-in-out infinite; }
  @keyframes beam { 50% { opacity: .65; } }
  .steam { animation: steam 2.8s ease-in-out infinite; opacity: 0; }
  @keyframes steam { 0% { transform: translateY(4px); opacity: 0; } 40% { opacity: .7; } 100% { transform: translateY(-10px); opacity: 0; } }
  .cat-body { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scaleY(1.06); } }
  .zzz { animation: zzz 3s ease-in-out infinite; opacity: 0; }
  @keyframes zzz { 0% { transform: translate(0, 0); opacity: 0; } 30% { opacity: .8; } 100% { transform: translate(6px, -12px); opacity: 0; } }
  .cat.awake .zzz { display: none; }
  .cat .eyes-open { display: none; }
  .cat.awake .eyes-open { display: inline; }
  .cat.awake .eyes-closed { display: none; }
  .note { opacity: 0; }
  .radio-on .note { animation: note 2.6s ease-out infinite; }
  @keyframes note { 0% { transform: translate(0, 0); opacity: 0; } 25% { opacity: .9; } 100% { transform: translate(-10px, -18px); opacity: 0; } }
  .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
  .leaf-sway { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 5s ease-in-out infinite; }

  /* 订单气泡 */
  .order {
    margin-top: 10px; background: var(--cream); border-radius: var(--r); padding: 10px 12px; position: relative; min-height: 58px;
    box-shadow: 0 2px 0 var(--line);
  }
  .order::before { content: ""; position: absolute; top: -6px; left: var(--tail, 50%); width: 12px; height: 12px; background: var(--cream); transform: translateX(-50%) rotate(45deg); border-radius: 2px; transition: left .3s; }
  .order .who { font-size: 12px; font-weight: 900; color: var(--ink); display: flex; align-items: center; gap: 6px; }
  .order .who span { font-size: 10px; font-weight: 700; color: #fff; background: var(--sage-d); padding: 1px 7px; border-radius: 99px; }
  .order p { margin: 4px 0 6px; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
  .order p b { color: var(--rose); }
  .want { display: flex; gap: 6px; flex-wrap: wrap; }
  .want span { display: inline-flex; align-items: center; gap: 2px; background: var(--butter); border-radius: 10px; padding: 2px 8px 2px 3px; font-size: 12px; font-weight: 900; color: var(--ink); }
  .want svg { width: 22px; height: 22px; }
  .want .wrapchip i { width: 16px; height: 16px; border-radius: 5px; display: inline-block; margin: 0 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
  .order .muted { color: var(--sub); font-size: 13px; padding-top: 8px; }

  /* 工作台 */
  .bench { display: grid; grid-template-columns: 1fr 120px; gap: 10px; margin-top: 10px; }
  .bouquet {
    position: relative; aspect-ratio: 1 / 1; border-radius: var(--r);
    background: radial-gradient(circle at 50% 45%, #fffaf0 0, #f6ead4 70%);
    box-shadow: 0 2px 0 var(--line), inset 0 0 0 6px #f0dfc2;
  }
  .bouquet svg { width: 100%; height: 100%; display: block; }
  .bouquet .head { cursor: pointer; }
  .bouquet .count { position: absolute; left: 14px; top: 11px; font-size: 11px; color: var(--ink-2); font-weight: 700; }
  .bouquet .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; color: var(--sub); padding: 30px; pointer-events: none; line-height: 1.6; }
  .side { display: flex; flex-direction: column; gap: 8px; background: var(--cream); border-radius: var(--r); padding: 10px; box-shadow: 0 2px 0 var(--line); }
  .side h4 { margin: 0; font-size: 12px; color: var(--ink); font-weight: 900; }
  .wraps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .wrap { aspect-ratio: 1; border-radius: 10px; position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); transition: transform .15s; }
  .wrap.on { box-shadow: 0 0 0 2px var(--cream), 0 0 0 4px var(--ink); transform: scale(.92); }
  .wrap.locked { opacity: .3; }
  .wrap-name { font-size: 11px; color: var(--ink-2); text-align: center; font-weight: 700; margin-top: -2px; }
  .btn { height: 42px; border-radius: 14px; font-weight: 900; font-size: 15px; transition: transform .1s; }
  .btn:active:not(:disabled) { transform: translateY(2px); }
  .btn.primary { background: var(--rose); color: #fff; box-shadow: 0 3px 0 #b8433a; }
  .btn.primary:disabled { background: #d9ccbd; box-shadow: 0 3px 0 #c6b6a5; color: #fff8; }
  .btn.ghost { background: var(--butter); color: var(--ink); font-size: 13px; height: 34px; box-shadow: 0 2px 0 #ead7a6; }

  /* 花架 */
  .shelf { margin-top: 12px; border-radius: var(--r); padding: 12px 10px 10px; background: linear-gradient(180deg, #b48759 0, #a57a50 100%); box-shadow: 0 4px 0 #8a6340; position: relative; }
  .shelf::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 6px; background: rgba(0,0,0,.08); }
  .shelf-head { display: flex; justify-content: space-between; font-size: 11px; color: #fff3dc; margin: 0 2px 8px; font-weight: 700; }
  .flowers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; position: relative; }
  .fl { background: var(--cream); border-radius: 16px; padding: 5px 2px 4px; text-align: center; position: relative; box-shadow: 0 3px 0 rgba(0,0,0,.14); }
  .fl > button:first-child:active { transform: translateY(1px); }
  .fl svg { width: 44px; height: 44px; display: block; margin: 0 auto; overflow: visible; }
  .fl .fn { font-size: 12px; font-weight: 900; color: var(--ink); }
  .fl .st { font-size: 10px; color: var(--ink-2); font-weight: 600; }
  .fl.out svg, .fl.out .fn { opacity: .35; }
  .fl.locked { background: rgba(255, 248, 232, .55); box-shadow: none; }
  .fl.locked svg { filter: grayscale(1); opacity: .35; }
  .fl.locked .fn, .fl.locked .st { color: #6d5a49; }
  .fl .restock { display: block; width: calc(100% - 8px); margin: 3px auto 0; font-size: 10px; font-weight: 900; padding: 3px 0; border-radius: 8px; background: var(--butter); color: #9a6a10; }
  .fl .restock:disabled { opacity: .45; }
  .fbub {
    position: absolute; left: 50%; top: -16px; transform: translateX(-50%) scale(0); transform-origin: 50% 100%; z-index: 3;
    background: #fff; color: var(--ink-2); font-size: 10px; font-weight: 800; white-space: nowrap; padding: 3px 7px; border-radius: 9px;
    box-shadow: 0 2px 6px rgba(60,40,20,.2); animation: fbub 2.6s ease forwards; pointer-events: none;
  }
  .fbub::after { content: ""; position: absolute; left: 50%; bottom: -3px; width: 6px; height: 6px; background: #fff; transform: translateX(-50%) rotate(45deg); }
  @keyframes fbub { 0% { transform: translateX(-50%) scale(0); } 10%, 85% { transform: translateX(-50%) scale(1); } 100% { transform: translateX(-50%) scale(0); } }

  /* 提示 / 弹窗 */
  .toast-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
  .toast { position: absolute; left: 50%; top: 34%; transform: translateX(-50%); background: var(--cream); color: var(--ink); padding: 10px 16px; border-radius: 16px; font-weight: 900; font-size: 15px; text-align: center; white-space: nowrap; box-shadow: 0 8px 24px rgba(60,40,20,.22); animation: floatup 1.8s ease-out forwards; }
  .toast small { display: block; font-size: 11px; font-weight: 600; color: var(--ink-2); margin-top: 2px; }
  .toast .stars { color: var(--gold); letter-spacing: 2px; }
  @keyframes floatup { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.94); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -30px); } }

  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(43, 35, 30, .5); display: none; align-items: center; justify-content: center; padding: 18px; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
  .modal.show { display: flex; }
  .card { background: var(--cream); border-radius: 26px; width: 100%; max-width: 380px; max-height: calc(100vh - 36px); overflow-y: auto; padding: 22px 18px 18px; animation: pop .35s cubic-bezier(.2, .9, .3, 1.2); }
  @keyframes pop { from { transform: translateY(12px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  .card h2 { margin: 0 0 4px; font-size: 22px; text-align: center; color: var(--ink); }
  .card .lead { text-align: center; color: var(--ink-2); font-size: 13px; margin: 0 0 14px; }
  .card .hero-svg { width: 140px; height: 140px; display: block; margin: 0 auto 4px; }
  .rules { margin: 0 0 16px; padding: 0; list-style: none; display: grid; gap: 8px; }
  .rules li { font-size: 13px; line-height: 1.6; display: flex; gap: 10px; color: var(--ink-2); background: #fff; border-radius: 14px; padding: 8px 10px; }
  .rules li i { flex: none; font-style: normal; width: 22px; height: 22px; border-radius: 8px; background: var(--sage-d); color: #fff; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .rules li b { color: var(--ink); }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .summary div { background: var(--butter); border-radius: 14px; padding: 10px 4px; text-align: center; font-size: 11px; color: var(--ink-2); font-weight: 700; }
  .summary div b { display: block; font-size: 19px; color: var(--ink); }
  .upgrades { display: grid; gap: 8px; margin-bottom: 14px; }
  .up { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 16px; padding: 10px; text-align: left; box-shadow: 0 2px 0 var(--line); }
  .up .em { width: 38px; height: 38px; border-radius: 12px; background: var(--butter); flex: none; display: flex; align-items: center; justify-content: center; }
  .up .em svg { width: 30px; height: 30px; }
  .up .tx { flex: 1; min-width: 0; }
  .up .tx b { font-size: 14px; display: block; color: var(--ink); }
  .up .tx small { font-size: 11px; color: var(--ink-2); }
  .up .price { flex: none; font-size: 12px; font-weight: 900; padding: 6px 10px; border-radius: 99px; background: var(--butter); color: #9a6a10; }
  .up.owned { opacity: .7; }
  .up.owned .price { background: #e1ecdc; color: var(--sage-d); }
  .up:disabled:not(.owned) .price { opacity: .5; }
  .unlock-note { background: #e9f0e4; color: var(--ink-2); border-radius: 14px; padding: 9px 12px; font-size: 12px; margin-bottom: 14px; line-height: 1.6; font-weight: 600; }
  .card .btn.primary { width: 100%; }
  .h4 { margin: 0 0 8px; font-size: 13px; color: var(--ink); }
  .footer { text-align: center; font-size: 11px; color: var(--ink-2); margin-top: 14px; }
  .footer button { text-decoration: underline; font-size: 11px; color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    .dust, .beam, .steam, .cat-body, .zzz, .note, .sway, .leaf-sway, .person.walking svg, .person.sel .marker, .card, .toast { animation: none !important; }
  }
</style>
</head>
<body>
<div class="game">
  <div class="hud">
    <div class="hud-day" id="dayLabel">DAY 1</div>
    <div class="hud-time"><span id="clock">09:00</span><div class="timebar"><i id="timeFill"></i></div></div>
    <div class="hud-pill"><small>¥</small><span id="coins">0</span></div>
    <div class="hud-pill" id="rep"><small>★</small>-</div>
    <button class="hud-btn" id="pauseBtn" aria-label="暂停">II</button>
  </div>
  <div class="goal"><span id="goalText"></span><span id="servedText"></span></div>

  <section class="scene" id="scene">
    <svg class="back" id="sceneBack" viewBox="0 0 390 250" aria-hidden="true"></svg>
    <div class="people" id="people"></div>
    <svg class="front" id="sceneFront" viewBox="0 0 390 250" aria-hidden="true"></svg>
  </section>

  <div class="order" id="order"></div>

  <section class="bench">
    <div class="bouquet" id="bouquet"></div>
    <div class="side">
      <h4>包装纸</h4>
      <div class="wraps" id="wraps"></div>
      <div class="wrap-name" id="wrapName"></div>
      <button class="btn ghost" id="clearBtn">清空重包</button>
      <button class="btn primary" id="serveBtn" disabled>包好送出</button>
    </div>
  </section>

  <section class="shelf">
    <div class="shelf-head"><span>花架</span><span>点花加进花束 · 点花束里的花可以拿出来</span></div>
    <div class="flowers" id="shelf"></div>
  </section>

  <p class="footer">进度自动保存在本机浏览器 · <button id="resetBtn">重新开店</button></p>
</div>

<div class="toast-layer" id="toasts"></div>
<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>

<script>
const FLOWERS = {
  rose:      { name: "玫瑰",   unit: "枝", price: 12, cost: 5, day: 1 },
  tulip:     { name: "郁金香", unit: "枝", price: 10, cost: 4, day: 1 },
  daisy:     { name: "雏菊",   unit: "枝", price: 6,  cost: 2, day: 1 },
  baby:      { name: "满天星", unit: "把", price: 5,  cost: 2, day: 1 },
  sunflower: { name: "向日葵", unit: "枝", price: 15, cost: 6, day: 2 },
  lavender:  { name: "薰衣草", unit: "把", price: 8,  cost: 3, day: 3 },
  hydrangea: { name: "绣球",   unit: "朵", price: 18, cost: 7, day: 3 },
  lily:      { name: "百合",   unit: "枝", price: 16, cost: 6, day: 4 }
};
const WRAPS = {
  kraft: { name: "牛皮纸", color: "#cfa57c", fold: "#b88b60", day: 1 },
  pink:  { name: "樱花粉", color: "#f2c4c4", fold: "#e2a3a6", day: 1 },
  white: { name: "奶油白", color: "#f6efe2", fold: "#ddd0bc", day: 1 },
  blue:  { name: "雾霾蓝", color: "#b8c9dc", fold: "#94a9c2", day: 2 },
  black: { name: "墨黑",   color: "#3d3532", fold: "#262120", day: 3 },
  green: { name: "豆沙绿", color: "#bcd3bd", fold: "#97b59a", day: 4 }
};
const OCCASIONS = [
  { tag: "生日",   lines: ["朋友今天生日", "明天闺蜜过生日", "给妈妈过生日"], fav: ["rose", "tulip", "sunflower", "hydrangea"], wraps: ["pink", "kraft", "white"] },
  { tag: "表白",   lines: ["今晚准备表白", "想送给喜欢的人"], fav: ["rose", "tulip"], wraps: ["pink", "black", "white"] },
  { tag: "探望",   lines: ["去医院看奶奶", "同事住院了"], fav: ["daisy", "sunflower", "lily"], wraps: ["kraft", "white", "blue", "green"] },
  { tag: "毕业",   lines: ["室友今天毕业", "女儿毕业典礼"], fav: ["sunflower", "daisy", "hydrangea"], wraps: ["kraft", "blue", "green"] },
  { tag: "纪念日", lines: ["结婚纪念日", "在一起一周年了"], fav: ["rose", "lily", "lavender"], wraps: ["black", "pink", "white"] },
  { tag: "道歉",   lines: ["惹女朋友生气了", "跟好朋友吵架了"], fav: ["tulip", "lavender", "hydrangea"], wraps: ["blue", "pink", "white"] },
  { tag: "犒劳自己", lines: ["下班早，想犒劳一下自己", "给新家添点颜色"], fav: ["tulip", "daisy", "lavender", "hydrangea"], wraps: ["kraft", "white", "green"] }
];
const NAMES = ["小林", "阿杰", "糖糖", "周周", "七七", "老王", "小鹿", "安安", "阿哲", "米粒", "陈姐", "豆豆", "星星", "小满", "阿泽", "苏苏"];
const HAIR = ["#3a2b25", "#5a4034", "#2a2422", "#7a5640", "#4b3a44", "#8b6a4f"];
const SHIRT = ["#e7b7a6", "#a9bfd6", "#b7cdab", "#ecd296", "#cbb3cc", "#e5c09c", "#9db7ad", "#f0e2c8"];

/* ---------- 花 ---------- */
function flowerSvg(type, x, y, s = 1) {
  const g = (inner) => `<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;
  switch (type) {
    case "rose":
      return g(`<circle r="11" fill="#d94b45"/><path d="M-11 0 A11 11 0 0 0 11 0 Z" fill="#c43c3a"/>
        <circle r="6.5" fill="#e7615a"/><path d="M-4 -1 Q0 -6 4 -1 Q1 3 -2 1" fill="none" stroke="#b5343a" stroke-width="1.6" stroke-linecap="round"/>`);
    case "tulip":
      return g(`<path d="M-9 -7 Q-10 8 0 10 Q10 8 9 -7 L4.5 -1 L0 -10 L-4.5 -1 Z" fill="#ef8fae"/>
        <path d="M0 -10 L-4.5 -1 L-9 -7 Q-9 5 -1 9 Z" fill="#f6b0c6"/>`);
    case "daisy": {
      let p = "";
      for (let i = 0; i < 10; i++) p += `<ellipse cx="0" cy="-7" rx="2.8" ry="5.4" fill="${i % 2 ? "#fffdf6" : "#f6f0e4"}" transform="rotate(${i * 36})"/>`;
      return g(p + `<circle r="4.2" fill="#f2bb3a"/><path d="M-4.2 0 A4.2 4.2 0 0 0 4.2 0 Z" fill="#e2a52a"/>`);
    }
    case "baby": {
      const pts = [[0, 0], [-6, -4], [6, -3], [-3, 6], [5, 6], [-8, 4], [2, -8], [8, 2], [-2, -3]];
      return g(`<path d="M0 12 L0 2 M0 6 L-6 -3 M0 6 L6 -2" stroke="#8fae86" stroke-width="1"/>` + pts.map(([a, b], i) => `<circle cx="${a}" cy="${b}" r="2.4" fill="${i % 3 ? "#fffdf8" : "#efe8dc"}"/>`).join(""));
    }
    case "sunflower": {
      let p = "";
      for (let i = 0; i < 14; i++) p += `<ellipse cx="0" cy="-10" rx="3.2" ry="6.4" fill="${i % 2 ? "#f5c13a" : "#f0ad2c"}" transform="rotate(${i * 25.7})"/>`;
      return g(p + `<circle r="7" fill="#6e4422"/><circle r="4" fill="#58361a"/>`);
    }
    case "lavender": {
      let p = `<path d="M0 12 L0 -12" stroke="#7d9c76" stroke-width="1.4"/>`;
      for (let i = 0; i < 6; i++) {
        const yy = -11 + i * 3.6, w = 2.4 + i * .25;
        p += `<ellipse cx="-2.1" cy="${yy}" rx="${w}" ry="2" fill="#a487cf"/><ellipse cx="2.1" cy="${yy + 1.4}" rx="${w}" ry="2" fill="#8e70c0"/>`;
      }
      return g(p);
    }
    case "hydrangea": {
      const pts = [[0, 0], [-6, -5], [6, -5], [-7, 3], [7, 3], [0, -9], [0, 8], [-3, -3], [3, 4], [4, -2], [-4, 6]];
      return g(`<circle r="12" fill="#a6bde3"/><path d="M-12 0 A12 12 0 0 0 12 0 Z" fill="#94acd9"/>` + pts.map(([a, b], i) => {
        const c1 = i % 2 ? "#8aa5dc" : "#c2b4e6", c2 = i % 2 ? "#9db4e2" : "#b2a1de";
        return `<g transform="translate(${a} ${b})"><circle cy="-1.6" r="1.8" fill="${c1}"/><circle cx="1.6" r="1.8" fill="${c1}"/><circle cy="1.6" r="1.8" fill="${c2}"/><circle cx="-1.6" r="1.8" fill="${c2}"/></g>`;
      }).join(""));
    }
    case "lily": {
      let p = "";
      for (let i = 0; i < 6; i++) p += `<path d="M0 0 Q-4.5 -7 0 -14 Q4.5 -7 0 0" fill="${i % 2 ? "#fffaf1" : "#f5ede0"}" transform="rotate(${i * 60})"/>`;
      for (let i = 0; i < 6; i++) p += `<path d="M0 0 L0 -7" stroke="#e99a5a" stroke-width="1" transform="rotate(${i * 60 + 30})"/><circle cy="-7" r="1.1" fill="#b85a2a" transform="rotate(${i * 60 + 30})"/>`;
      return g(p + `<circle r="2" fill="#d6e48a"/>`);
    }
  }
  return "";
}
function iconSvg(type, sway = false) {
  return `<svg viewBox="-16 -16 32 32" aria-hidden="true"><g ${sway ? `class="sway" style="animation-delay:-${(Math.random() * 4).toFixed(2)}s"` : ""}>${flowerSvg(type, 0, 0, 1)}</g></svg>`;
}

function upgradeIcon(id) {
  const icons = {
    chair: `<rect x="3" y="11" width="24" height="5" rx="2.5" fill="#d9b27c"/><path d="M6 16 L5 28 M24 16 L25 28 M15 16 L15 28" stroke="#b88f5c" stroke-width="2.5" stroke-linecap="round"/>`,
    bucket: `<path d="M6 12 L24 12 L22 28 L8 28 Z" fill="#b9c4c8"/><rect x="5" y="10" width="20" height="4" rx="2" fill="#cfd8db"/>${flowerSvg("tulip", 11, 7, .4)}${flowerSvg("sunflower", 19, 6, .35)}`,
    bell: `<path d="M8 22 Q8 8 15 8 Q22 8 22 22 Z" fill="#e7b64a"/><rect x="6" y="21" width="18" height="3" rx="1.5" fill="#d5a23a"/><circle cx="15" cy="26" r="2.2" fill="#c9952e"/><line x1="15" y1="4" x2="15" y2="8" stroke="#9a7b5c" stroke-width="1.4"/>`,
    window: `<rect x="3" y="18" width="24" height="9" rx="3" fill="#b8865a"/>${flowerSvg("rose", 9, 15, .38)}${flowerSvg("daisy", 15, 13, .38)}${flowerSvg("tulip", 21, 15, .38)}`
  };
  return `<svg viewBox="0 0 30 30">${icons[id]}</svg>`;
}

function bouquetSvg(items, wrapKey, interactive = true) {
  const w = WRAPS[wrapKey];
  const n = items.length;
  const pos = [];
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? .5 : i / (n - 1);
    const ang = (-62 + t * 124) * Math.PI / 180;
    const rad = 26 + (i % 3) * 15 + (n > 8 ? 6 : 0);
    pos.push([100 + Math.sin(ang) * rad, 92 - Math.cos(ang) * rad * .85]);
  }
  const order = pos.map((p, i) => i).sort((a, b) => pos[a][1] - pos[b][1]);
  let stems = "", heads = "";
  order.forEach((i) => {
    const [x, y] = pos[i];
    stems += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} Q${((x + 100) / 2).toFixed(1)} ${(y + 40).toFixed(1)} 100 172" stroke="#7d9c76" stroke-width="2.2" fill="none"/>`;
    const leaf = i % 2 ? `<ellipse cx="${(x + 6).toFixed(1)}" cy="${(y + 16).toFixed(1)}" rx="7" ry="3" fill="#8fb086" transform="rotate(35 ${(x + 6).toFixed(1)} ${(y + 16).toFixed(1)})"/>` : "";
    const delay = `style="animation-delay:-${((i * 0.63) % 4).toFixed(2)}s"`;
    heads += leaf + `<g class="${interactive ? "head " : ""}sway" ${delay} data-i="${i}">${flowerSvg(items[i], x, y, items[i] === "hydrangea" ? 1.5 : 1.35)}<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="14" fill="transparent"/></g>`;
  });
  const paper = w
    ? `<ellipse cx="100" cy="190" rx="34" ry="5" fill="#000" opacity=".06"/>
       <path d="M48 96 L152 96 L112 186 L88 186 Z" fill="${w.color}"/>
       <path d="M48 96 L100 112 L88 186 Z" fill="${w.fold}" opacity=".6"/>
       <path d="M152 96 L100 112 L112 186 Z" fill="#fff" opacity=".16"/>
       <path d="M84 150 Q100 157 116 150" stroke="#d9685a" stroke-width="5" fill="none" stroke-linecap="round"/>
       <path d="M100 153 l-11 14 M100 153 l11 14" stroke="#d9685a" stroke-width="4" stroke-linecap="round"/>`
    : `<path d="M90 186 L110 186" stroke="#cdbba5" stroke-width="3" stroke-dasharray="4 3" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 200 200" aria-label="当前花束">${stems}${heads}${paper}</svg>`;
}

/* ---------- 状态 ---------- */
function freshSave() {
  return { day: 1, coins: 40, earned: 0, upgrades: [], stock: { rose: 8, tulip: 8, daisy: 8, baby: 6 }, stars: [], won: false };
}
let save = load();
let run = null;
let bench = { items: [], wrap: null };
let selectedId = null;
let paused = true;
let lastTs = 0;
let idSeq = 1;
let radioOn = true;
let catPetDay = 0;

function load() {
  try { return Object.assign(freshSave(), JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch { return freshSave(); }
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch {} }
const has = (id) => save.upgrades.includes(id);
const unlockedFlowers = () => Object.keys(FLOWERS).filter((k) => FLOWERS[k].day <= save.day);
const unlockedWraps = () => Object.keys(WRAPS).filter((k) => WRAPS[k].day <= save.day);
const rand = (a) => a[Math.floor(Math.random() * a.length)];
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const $ = (s) => document.querySelector(s);

function startDay() {
  unlockedFlowers().forEach((k) => { if (save.stock[k] == null) save.stock[k] = 6; });
  run = { t: DAY_SECONDS, customers: [], nextSpawn: 1.5, served: 0, angry: 0, income: 0, dayStars: [], closed: false };
  bench = { items: [], wrap: null };
  selectedId = null;
  paused = false;
  $("#people").innerHTML = "";
  closeModal();
  renderAll();
}

function spawnInterval() {
  const base = Math.max(6, 11.5 - save.day * .8);
  return (has("bell") ? base * .75 : base) * (.8 + Math.random() * .4);
}
function patienceFor(order) {
  const base = Math.max(32, 55 - save.day * 2.5) + order.total * 2.5;
  return has("chair") ? base * 1.35 : base;
}

function makeOrder() {
  const fl = unlockedFlowers();
  const wr = unlockedWraps();
  const occ = rand(OCCASIONS);
  const favs = occ.fav.filter((f) => fl.includes(f));
  const main = favs.length ? rand(favs) : rand(fl.filter((f) => f !== "baby"));
  const want = {};
  want[main] = randInt(1, Math.min(6, 2 + save.day));
  if (Math.random() < .35 + save.day * .08) {
    const others = fl.filter((f) => f !== main && f !== "baby");
    if (others.length) want[rand(others)] = randInt(1, Math.min(4, 1 + save.day));
  }
  if (Math.random() < .5) want.baby = randInt(1, 2);
  const wraps = occ.wraps.filter((w) => wr.includes(w));
  const wrap = wraps.length ? rand(wraps) : "kraft";
  const total = Object.values(want).reduce((a, b) => a + b, 0);
  const value = Object.entries(want).reduce((s, [k, n]) => s + FLOWERS[k].price * n, 0) + 4;
  return { occ, line: rand(occ.lines), want, wrap, total, value };
}

function spawnCustomer() {
  if (run.customers.length >= 3) return;
  const order = makeOrder();
  const p = patienceFor(order);
  const c = {
    id: idSeq++, name: rand(NAMES), hair: rand(HAIR), shirt: rand(SHIRT), style: rand(HAIRSTYLE),
    order, patience: p, maxPatience: p
  };
  run.customers.push(c);
  addPerson(c);
  if (selectedId == null) selectedId = c.id;
  layoutPeople();
  renderOrder();
}

/* ---------- 人物 DOM ---------- */
function personEl(id) { return document.querySelector(`.person[data-id="${id}"]`); }

function addPerson(c) {
  const el = document.createElement("div");
  el.className = "person walking arriving";
  el.dataset.id = c.id;
  el.dataset.mood = 2;
  el.style.left = `${DOOR_X}%`;
  el.style.opacity = "0";
  el.setAttribute("aria-label", `${c.name}的订单`);
  el.innerHTML = `<div class="ptop"><div class="mood"></div><div class="pbar"><i style="width:100%;background:#8fa98a"></i></div><div class="marker"></div></div>${personSvg(c, 1)}`;
  $("#people").appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => { el.style.opacity = "1"; }));
  setTimeout(() => { el.classList.remove("walking", "arriving"); say(c.id, rand(["你好～", "打扰啦", "嗨", "在吗？"])); }, 1150);
}

function layoutPeople() {
  run.customers.forEach((c, i) => {
    const el = personEl(c.id);
    if (!el) return;
    const target = `${SLOT_X[i]}%`;
    if (el.style.left !== target) {
      el.style.left = target;
      if (!el.classList.contains("arriving")) {
        el.classList.add("walking");
        setTimeout(() => el.classList.remove("walking"), 1100);
      }
    }
    el.classList.toggle("sel", c.id === selectedId);
  });
}

function say(id, text, ms = 1600) {
  const el = personEl(id);
  if (!el) return;
  const m = el.querySelector(".mood");
  m.textContent = text;
  m.classList.add("show");
  clearTimeout(m._t);
  m._t = setTimeout(() => m.classList.remove("show"), ms);
}

function updatePeople() {
  for (const c of run.customers) {
    const el = personEl(c.id);
    if (!el) continue;
    const r = Math.max(0, c.patience / c.maxPatience);
    const bar = el.querySelector(".pbar i");
    bar.style.width = `${r * 100}%`;
    bar.style.background = r > .55 ? "#8fa98a" : r > .25 ? "#e7a83a" : "#e0564a";
    const mood = r > .55 ? 2 : r > .25 ? 1 : 0;
    if (+el.dataset.mood !== mood) {
      el.dataset.mood = mood;
      el.querySelector("svg").outerHTML = personSvg(c, r);
      if (mood === 0) say(c.id, rand(["还要多久呀…", "有点赶时间", "……"]), 2200);
    }
  }
}

/* ---------- 循环 ---------- */
function tick(ts) {
  const dt = Math.min(.1, (ts - lastTs) / 1000 || 0);
  lastTs = ts;
  if (!paused && run && !run.closed) {
    run.t -= dt;
    run.nextSpawn -= dt;
    if (run.nextSpawn <= 0 && run.t > 8) { spawnCustomer(); run.nextSpawn = spawnInterval(); }
    for (const c of [...run.customers]) {
      c.patience -= dt;
      if (c.patience <= 0) customerLeaves(c, false);
    }
    if (run.t <= 0) endDay();
    updateHudTime();
    updatePeople();
  }
  requestAnimationFrame(tick);
}

function updateHudTime() {
  const r = Math.max(0, run.t / DAY_SECONDS);
  $("#timeFill").style.width = `${r * 100}%`;
  const minutes = Math.round((1 - r) * 600);
  const hh = 9 + Math.floor(minutes / 60), mm = minutes % 60;
  $("#clock").textContent = `${String(hh).padStart(2, "0")}:${String(Math.floor(mm / 10) * 10).padStart(2, "0")}`;
}

function customerLeaves(c, happy, reaction) {
  run.customers = run.customers.filter((x) => x.id !== c.id);
  if (!happy) {
    run.angry++;
    run.dayStars.push(0);
    save.stars.push(0);
    toast("客人等不及走掉了", `${c.name}：下次再来吧…`);
  }
  if (selectedId === c.id) selectedId = run.customers[0]?.id ?? null;
  const el = personEl(c.id);
  if (el) {
    say(c.id, reaction || "哼…", 900);
    el.classList.remove("sel");
    setTimeout(() => {
      el.classList.add("walking");
      el.style.left = `${DOOR_X}%`;
      el.style.opacity = "0";
      setTimeout(() => el.remove(), 1150);
    }, 700);
  }
  setTimeout(() => layoutPeople(), 300);
  renderOrder(); renderTop();
}

/* ---------- 交互 ---------- */
function addFlower(k) {
  if (paused || !run || run.closed) return;
  if (FLOWERS[k].day > save.day) return;
  if ((save.stock[k] || 0) <= 0) return toast(`${FLOWERS[k].name}卖完了`, "点下方“进货”补一点");
  if (bench.items.length >= 14) return toast("花束已经塞不下啦");
  save.stock[k]--;
  bench.items.push(k);
  renderBench(); renderShelf();
}
function removeFlowerAt(i) {
  const k = bench.items[i];
  if (!k) return;
  bench.items.splice(i, 1);
  save.stock[k]++;
  renderBench(); renderShelf();
}
function clearBench() {
  bench.items.forEach((k) => save.stock[k]++);
  bench = { items: [], wrap: bench.wrap };
  renderBench(); renderShelf();
}
function restock(k) {
  const qty = has("bucket") ? 8 : 5;
  const price = FLOWERS[k].cost * qty;
  if (save.coins < price) return toast("钱不够进货了", `需要 ¥${price}`);
  save.coins -= price;
  save.stock[k] = (save.stock[k] || 0) + qty;
  persist();
  renderShelf(); renderTop();
}

function serve() {
  const c = run.customers.find((x) => x.id === selectedId);
  if (!c || !bench.items.length) return;
  const have = {};
  bench.items.forEach((k) => { have[k] = (have[k] || 0) + 1; });
  const keys = new Set([...Object.keys(have), ...Object.keys(c.order.want)]);
  let diff = 0;
  keys.forEach((k) => { diff += Math.abs((have[k] || 0) - (c.order.want[k] || 0)); });
  const wrapOk = bench.wrap === c.order.wrap;
  let stars;
  if (diff === 0 && wrapOk) stars = 3;
  else if (diff <= 1 && (wrapOk || diff === 0)) stars = 2;
  else if (diff <= 3 && bench.wrap) stars = 1;
  else stars = 0;

  const ratio = Math.max(0, c.patience / c.maxPatience);
  const pay = Math.round(c.order.value * [0, .5, .85, 1][stars]);
  const tip = stars ? Math.round(ratio * c.order.value * .35 * (stars / 3) * (has("window") ? 1.6 : 1)) : 0;
  const total = pay + tip;
  save.coins += total;
  save.earned += total;
  run.income += total;
  run.served++;
  run.dayStars.push(stars);
  save.stars.push(stars);

  const msg = stars === 3 ? "完全就是我想要的" : stars === 2 ? "挺好看的，谢谢" : stars === 1 ? "嗯…也行吧" : "这不是我要的…";
  const why = [];
  if (diff) why.push(`花差了 ${diff} 处`);
  if (!wrapOk) why.push(bench.wrap ? "包装纸不对" : "没有包装");
  toast(`<span class="stars">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</span>  +¥${total}`,
    `${c.name}：${msg}${why.length ? "（" + why.join("，") + "）" : tip ? `（小费 ¥${tip}）` : ""}`);

  bench = { items: [], wrap: null };
  customerLeaves(c, true, stars === 3 ? "♡ 谢谢！" : stars === 2 ? "谢谢～" : stars === 1 ? "嗯…" : "……");
  persist();
  renderBench(); renderShelf(); renderTop();
  if (!save.won && save.earned >= GOAL) {
    save.won = true; persist();
    setTimeout(() => toast("累计营业额达成目标", "你的小花店成了这条街最受欢迎的店"), 1900);
  }
}

function endDay() {
  run.closed = true;
  paused = true;
  run.customers.forEach((c) => {
    const el = personEl(c.id);
    if (el) { el.classList.add("walking"); el.style.left = `${DOOR_X}%`; el.style.opacity = "0"; setTimeout(() => el.remove(), 1150); }
  });
  run.customers = [];
  bench.items.forEach((k) => save.stock[k]++);
  bench = { items: [], wrap: null };
  const avg = run.dayStars.length ? (run.dayStars.reduce((a, b) => a + b, 0) / run.dayStars.length).toFixed(1) : "-";
  save.day++;
  persist();
  renderAll();
  $("#doorSign").textContent = "CLOSED";
  setTimeout(() => showDaySummary(save.day - 1, avg), 600);
}

/* ---------- 渲染 ---------- */
function renderTop() {
  $("#dayLabel").textContent = `DAY ${save.day}`;
  $("#coins").textContent = save.coins;
  const s = save.stars.slice(-20);
  $("#rep").innerHTML = `<small>★</small>${s.length ? (s.reduce((a, b) => a + b, 0) / s.length).toFixed(1) : "-"}`;

function renderScene() {
  $("#sceneBack").innerHTML = sceneBackSvg();
  $("#sceneFront").innerHTML = sceneFrontSvg();
  updateScene();
}
function updateScene() {
  $("#calDay").textContent = save.day;

  $("#doorSign").setAttribute("fill", run && !run.closed ? "#6f8b6b" : "#d9685a");

  $("#upBucket").style.display = has("bucket") ? "" : "none";
  $("#upChair").style.display = has("chair") ? "" : "none";
  $("#radio").classList.toggle("radio-on", radioOn);
}

function renderOrder() {
  const b = $("#order");
  const cs = run ? run.customers : [];
  const idx = cs.findIndex((c) => c.id === selectedId);
  if (idx < 0) {
    b.style.setProperty("--tail", "50%");
    b.innerHTML = `<div class="muted">${run && !run.closed ? "店里很安静。等等下一位客人，顺便看看花架上的库存～" : "今天打烊啦。"}</div>`;
    renderServeBtn();
    return;
  }

  b.innerHTML = `<div class="who">${c.name}<span>${c.order.occ.tag}</span></div>
    <p>${c.order.line}，想要${parts.join("、")}，用<b>${WRAPS[c.order.wrap].name}</b>包。</p>
    <div class="want">${Object.entries(c.order.want).map(([k, n]) => `<span>${iconSvg(k)}× ${n}</span>`).join("")}
      <span class="wrapchip"><i style="background:${WRAPS[c.order.wrap].color}"></i>${WRAPS[c.order.wrap].name}</span></div>`;
  layoutPeople();
  renderServeBtn();
}

function renderBench() {
  $("#bouquet").innerHTML = bouquetSvg(bench.items, bench.wrap) +
    `<div class="count">${bench.items.length} 枝 · 成本 ¥${bench.items.reduce((s, k) => s + FLOWERS[k].cost, 0)}</div>` +
    (bench.items.length ? "" : `<div class="hint">点下面花架上的花<br>开始包这一束</div>`);
  const ul = unlockedWraps();
  $("#wraps").innerHTML = Object.entries(WRAPS).map(([k, w]) =>
    `<button class="wrap ${bench.wrap === k ? "on" : ""} ${ul.includes(k) ? "" : "locked"}" data-wrap="${k}" style="background:${w.color}" aria-label="${w.name}${ul.includes(k) ? "" : "（第" + w.day + "天解锁）"}"></button>`).join("");
  $("#wrapName").textContent = bench.wrap ? WRAPS[bench.wrap].name : "还没选包装纸";
  renderServeBtn();
}

function renderServeBtn() {
  const c = run && run.customers.find((x) => x.id === selectedId);
  $("#serveBtn").disabled = !(run && !run.closed && !paused && bench.items.length && c);
  $("#serveBtn").textContent = c ? `送给${c.name}` : "包好送出";
}

function renderShelf() {
  const qty = has("bucket") ? 8 : 5;
  $("#shelf").innerHTML = Object.entries(FLOWERS).map(([k, f]) => {
    const st = save.stock[k] || 0;
    if (f.day > save.day) return `<div class="fl locked" data-fl="${k}">${iconSvg(k)}<div class="fn">${f.name}</div><div class="st">第 ${f.day} 天解锁</div></div>`;
    return `<div class="fl ${st ? "" : "out"}" data-fl="${k}">
      <button data-add="${k}" style="width:100%" aria-label="加一${f.unit}${f.name}">${iconSvg(k, true)}<div class="fn">${f.name}</div><div class="st">库存 ${st} · ¥${f.price}</div></button>
      <button class="restock" data-restock="${k}" ${save.coins < f.cost * qty ? "disabled" : ""}>进货 +${qty} · ¥${f.cost * qty}</button>
    </div>`;
  }).join("");
}

function renderAll() { renderTop(); updateScene(); renderOrder(); renderBench(); renderShelf(); }

function flowerChatter() {
  if (!paused && run && !run.closed && Math.random() < .7) {
    const cand = [...document.querySelectorAll(".fl:not(.locked):not(.out)")];
    if (cand.length) {
      const el = rand(cand);

        el.appendChild(b);

      }

}

function showDaySummary(day, avg) {
  const newF = Object.values(FLOWERS).filter((f) => f.day === save.day).map((f) => f.name);
  const newW = Object.values(WRAPS).filter((w) => w.day === save.day).map((w) => w.name + "包装纸");
  const unlock = newF.length || newW.length ? `<div class="unlock-note">明天的花市会送来：${[...newF, ...newW].join("、")}</div>` : "";
  openModal(`<h2>第 ${day} 天打烊</h2>
    <p class="lead">${run.angry ? `有 ${run.angry} 位客人没等到花就走了` : "今天的客人都带着花开心地走了"}</p>
    <div class="summary">
      <div><b>¥${run.income}</b>今日收入</div>
      <div><b>${run.served}</b>接待客人</div>
      <div><b>${avg}</b>平均星级</div>
    </div>
    ${unlock}
    <h4 class="h4">添置小店（当前 ¥${save.coins}）</h4>
    <div class="upgrades">${UPGRADES.map((u) => {
      const owned = has(u.id);
      return `<button class="up ${owned ? "owned" : ""}" data-buy="${u.id}" data-avg="${avg}" ${owned || save.coins < u.cost ? "disabled" : ""}>
        <span class="em">${upgradeIcon(u.id)}</span><span class="tx"><b>${u.name}</b><small>${u.desc}</small></span>
        <span class="price">${owned ? "已摆上" : "¥" + u.cost}</span></button>`;
    }).join("")}</div>
    <button class="btn primary" id="startBtn">开始第 ${save.day} 天营业</button>`);
}

function buy(id, avg) {
  const u = UPGRADES.find((x) => x.id === id);
  if (!u || has(id) || save.coins < u.cost) return;
  save.coins -= u.cost;
  save.upgrades.push(id);
  persist();
  toast(`摆上了${u.name}`, u.desc);
  showDaySummary(save.day - 1, avg);
  renderTop(); renderShelf(); updateScene();
}

function togglePause() {
  if (!run || run.closed) return;
  paused = !paused;
  if (paused) openModal(`<h2>休息一下</h2><p class="lead">泡杯茶，客人们会等你回来</p><button class="btn primary" id="resumeBtn">继续营业</button>`);
  else closeModal();
  renderTop(); renderServeBtn();
}

function toast(main, sub = "") {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `${main}${sub ? `<small>${sub}</small>` : ""}`;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 1850);
}

/* ---------- 彩蛋 ---------- */
function petCat() {
  const cat = $("#cat");
  cat.classList.add("awake");
  $("#catBubble").style.display = "";
  setTimeout(() => { cat.classList.remove("awake"); $("#catBubble").style.display = "none"; }, 1800);
  if (catPetDay !== save.day && run && !run.closed) {
    catPetDay = save.day;
    save.coins += 5; persist(); renderTop();
    toast("年糕醒了一下", "蹭了蹭你的手，柜台下面滚出来 ¥5");
  }
}

/* ---------- 事件 ---------- */
document.addEventListener("click", (e) => {
  const t = e.target;
  const person = t.closest(".person");
  if (person && run && run.customers.some((c) => c.id === +person.dataset.id)) {
    selectedId = +person.dataset.id; renderOrder(); return;
  }
  const head = t.closest(".head");
  if (head) return removeFlowerAt(+head.dataset.i);
  const add = t.closest("[data-add]");
  if (add) return addFlower(add.dataset.add);
  const rs = t.closest("[data-restock]");
  if (rs) return restock(rs.dataset.restock);
  const wrap = t.closest("[data-wrap]");
  if (wrap) {
    if (WRAPS[wrap.dataset.wrap].day > save.day) return toast(`第 ${WRAPS[wrap.dataset.wrap].day} 天解锁`);
    bench.wrap = wrap.dataset.wrap; return renderBench();
  }
  const buyBtn = t.closest("[data-buy]");
  if (buyBtn) return buy(buyBtn.dataset.buy, buyBtn.dataset.avg);
  if (t.closest("#cat")) return petCat();
  if (t.closest("#radio")) { radioOn = !radioOn; updateScene(); return toast(radioOn ? "收音机在放老歌" : "收音机关掉了", radioOn ? "沙沙…♪" : "店里一下子安静下来"); }
  if (t.closest("#coffee")) return toast("咖啡还是热的", "早上开店前冲的");
  if (t.closest("#calendar")) return toast(`开店第 ${save.day} 天`, save.day === 1 ? "一切刚刚开始" : "日子过得真快");
  if (t.closest("#startBtn")) return startDay();
  if (t.closest("#resumeBtn") || t.closest("#pauseBtn")) return togglePause();
  if (t.closest("#serveBtn")) return serve();
  if (t.closest("#clearBtn")) return clearBench();
  if (t.closest("#resetBtn")) {
    if (confirm("确定要关掉这家店重新开始吗？进度会清空。")) {
      save = freshSave(); persist(); run = null; paused = true; bench = { items: [], wrap: null };
      $("#people").innerHTML = ""; renderAll(); showStart();
    }
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden && run && !run.closed && !paused) togglePause();
});

renderScene();
renderAll();
showStart();
flowerChatter();
requestAnimationFrame((ts) => { lastTs = ts; tick(ts); });
</script>
</body>
</html>
