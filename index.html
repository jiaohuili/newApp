<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>拍照姿势抽卡 · 39 个出片姿势</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>" />
<meta name="description" content="摆拍前抽一张卡：39 个拍照姿势，每张都有真人示范图和机位示意。示范图为 AI 生成内容。" />
<style>
  :root {
    --red: #e8473c;
    --red-deep: #d23a30;
    --ink: #2b2420;
    --sub: #8a7e76;
    --line: #efe6df;
    --bg: #fbf5f1;
    --card: #ffffff;
    --chip: #f6eee8;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--ink);
    background: var(--bg);
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .app { max-width: 480px; margin: 0 auto; padding: 0 16px 112px; position: relative; }

  .hero {
    position: relative;
    margin: 0 -16px;
    padding: 22px 20px 18px;
    background:
      radial-gradient(circle at 88% 12%, #f6c9bd 0, transparent 38%),
      radial-gradient(circle at 10% 90%, #f9e2d4 0, transparent 45%),
      linear-gradient(180deg, #fbe7df 0%, var(--bg) 100%);
    overflow: hidden;
  }
  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    background: var(--red); color: #fff;
  }
  .pill.ai { background: rgba(43, 36, 32, .78); }
  .hero h1 { font-size: 30px; margin: 12px 0 6px; letter-spacing: 1px; font-weight: 900; }
  .hero p { margin: 0; font-size: 13px; color: var(--sub); }
  .hero p b { color: var(--red); }
  .draw-badge {
    position: absolute; right: 18px; top: 52px;
    width: 76px; height: 76px; border-radius: 50%;
    background: var(--red); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; font-size: 18px; line-height: 1.1;
    box-shadow: 0 8px 22px rgba(232, 71, 60, .38), inset 0 0 0 4px rgba(255,255,255,.25);
    transform: rotate(-8deg);
    animation: wobble 3.2s ease-in-out infinite;
  }
  .draw-badge small { font-size: 10px; font-weight: 500; opacity: .9; margin-top: 2px; }
  @keyframes wobble { 0%,100% { transform: rotate(-8deg) scale(1); } 50% { transform: rotate(4deg) scale(1.05); } }

  .tabs { display: flex; gap: 18px; margin: 14px 0 10px; border-bottom: 1px solid var(--line); }
  .tab { padding: 10px 0; font-size: 15px; color: var(--sub); position: relative; }
  .tab.on { color: var(--ink); font-weight: 700; }
  .tab.on::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: -1px; height: 3px; border-radius: 3px; background: var(--red); }

  .panel { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 0 var(--line); }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .panel-head h2 { margin: 0; font-size: 15px; }
  .panel-head span { font-size: 11px; color: var(--sub); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--chip); font-size: 13px; color: #5d524b; }
  .chip i { font-style: normal; font-size: 11px; color: var(--sub); margin-left: 2px; }
  .chip.on { background: var(--ink); color: #fff; }
  .chip.on i { color: rgba(255,255,255,.7); }
  .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .toggle-row b { font-size: 14px; display: block; }
  .toggle-row small { font-size: 11px; color: var(--sub); }
  .switch { width: 44px; height: 26px; border-radius: 999px; background: #e3d9d2; position: relative; transition: background .2s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
  .switch.on { background: var(--red); }
  .switch.on::after { transform: translateX(18px); }
  .pool-note { font-size: 12px; color: var(--sub); margin: 4px 2px 10px; }
  .pool-note b { color: var(--red); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card {
    position: relative; border-radius: 14px; overflow: hidden; background: #eee;
    aspect-ratio: 3 / 4; text-align: left; padding: 0;
    box-shadow: 0 4px 14px rgba(80, 50, 30, .08);
    transition: transform .15s;
  }
  .card:active { transform: scale(.97); }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card::after { content: ""; position: absolute; inset: 55% 0 0 0; background: linear-gradient(transparent, rgba(0,0,0,.55)); pointer-events: none; }
  .tag {
    position: absolute; top: 8px; font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 6px;
    background: rgba(255,255,255,.92); color: var(--ink); z-index: 2;
  }
  .tag.scene { left: 8px; }
  .tag.noface { right: 8px; background: rgba(43,36,32,.82); color: #fff; }
  .card .title {
    position: absolute; left: 10px; right: 52px; bottom: 9px; z-index: 2;
    color: #fff; font-size: 13px; font-weight: 700; line-height: 1.3; text-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .card .title .heart { color: #ff8a80; margin-left: 2px; }
  .card .ai-mark {
    position: absolute; left: 8px; top: 30px; z-index: 2; font-size: 9px; padding: 1px 5px; border-radius: 4px;
    background: rgba(0,0,0,.35); color: rgba(255,255,255,.9);
  }
  .mini-cam {
    position: absolute; right: 7px; bottom: 7px; z-index: 2;
    width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,.93);
    box-shadow: 0 2px 6px rgba(0,0,0,.18); padding: 3px;
  }
  .mini-cam svg { width: 100%; height: 100%; display: block; }

  .empty { text-align: center; color: var(--sub); font-size: 13px; padding: 48px 0; grid-column: 1 / -1; }
  .empty b { display: block; font-size: 32px; margin-bottom: 8px; }

  .footer-note { font-size: 11px; color: var(--sub); text-align: center; margin: 22px 0 0; line-height: 1.7; }

  .cta-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 35%);
  }
  .cta {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; max-width: 448px; margin: 0 auto; height: 52px; border-radius: 999px;
    background: var(--red); color: #fff; font-size: 17px; font-weight: 800; letter-spacing: 1px;
    box-shadow: 0 8px 20px rgba(232, 71, 60, .35);
  }
  .cta:active { background: var(--red-deep); }
  .cta small { font-size: 11px; font-weight: 500; opacity: .85; letter-spacing: 0; }
  .cta:disabled { background: #cbbfb8; box-shadow: none; }

  .mask {
    position: fixed; inset: 0; z-index: 40; background: rgba(30, 22, 18, .62);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 18px;
  }
  .mask.show { display: flex; }
  .sheet {
    width: 100%; max-width: 380px; max-height: calc(100vh - 36px); overflow-y: auto;
    background: #fff; border-radius: 22px; position: relative;
    animation: pop .45s cubic-bezier(.2, .9, .3, 1.2);
  }
  @keyframes pop { from { transform: rotateY(90deg) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet .photo { position: relative; aspect-ratio: 3 / 4; max-height: 52vh; width: 100%; overflow: hidden; background: #eee; }
  .sheet .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sheet .photo .tag { top: 12px; font-size: 11px; }
  .sheet .photo .tag.scene { left: 12px; }
  .sheet .photo .tag.noface { right: 52px; }
  .sheet .photo .ai-mark { position: absolute; left: 12px; bottom: 12px; font-size: 10px; padding: 2px 7px; border-radius: 5px; background: rgba(0,0,0,.45); color: #fff; }
  .sheet .photo .angle { position: absolute; left: 12px; bottom: 38px; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 6px; background: rgba(43,36,32,.8); color: #fff; }
  .sheet .photo .mini-cam { width: 62px; height: 62px; right: 12px; bottom: 12px; border-radius: 14px; padding: 4px; }
  .close {
    position: absolute; top: 10px; right: 10px; z-index: 3; width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,.92); font-size: 18px; line-height: 32px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .sheet .body { padding: 16px 16px 14px; }
  .sheet h3 { margin: 0 0 12px; font-size: 20px; display: flex; align-items: baseline; gap: 8px; }
  .sheet h3 span { font-size: 12px; font-weight: 500; color: var(--sub); }
  .row { display: flex; gap: 10px; margin-bottom: 10px; font-size: 13px; line-height: 1.6; color: #4a403a; }
  .row em { flex: none; font-style: normal; font-size: 11px; font-weight: 700; color: #fff; width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.1; }
  .row:nth-child(2) em { background: #e8473c; }
  .row:nth-child(3) em { background: #f0a04b; }
  .row:nth-child(4) em { background: #5a9e6f; }
  .row:nth-child(5) em { background: #5b7fc7; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .fav { width: 50px; height: 46px; border-radius: 14px; border: 1.5px solid #f2c7c2; color: var(--red); font-size: 20px; flex: none; }
  .fav.on { background: #fdecea; }
  .again { flex: 1; height: 46px; border-radius: 14px; background: var(--red); color: #fff; font-weight: 800; font-size: 16px; }
  .sheet-note { text-align: center; font-size: 11px; color: var(--sub); margin-top: 10px; }

  .shuffle { position: fixed; inset: 0; z-index: 45; display: none; align-items: center; justify-content: center; pointer-events: none; }
  .shuffle.show { display: flex; }
  .shuffle .deck { position: relative; width: 150px; height: 200px; }
  .shuffle .deck div {
    position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(135deg, #f26b5f, #d23a30);
    border: 4px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,.3);
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 22px;
    animation: shuffle .7s ease-in-out infinite;
  }
  .shuffle .deck div:nth-child(2) { animation-delay: .12s; }
  .shuffle .deck div:nth-child(3) { animation-delay: .24s; }
  @keyframes shuffle {
    0%, 100% { transform: translateX(0) rotate(0); }
    25% { transform: translateX(-46px) rotate(-12deg); }
    75% { transform: translateX(46px) rotate(12deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .draw-badge, .shuffle .deck div, .sheet { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="pill-row">
      <span class="pill">每张卡都配机位示意图</span>
      <span class="pill ai">含AI生成内容</span>
    </div>
    <h1>拍照姿势抽卡</h1>
    <p>摆拍前抽一张卡试试 · <b id="totalCount">39</b> 个姿势 · 不露脸 <b id="nofaceCount">11</b> 个</p>
    <button class="draw-badge" id="badgeDraw" aria-label="抽一张">抽一张<small>照着拍</small></button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab on" data-tab="all" role="tab">全部姿势</button>
    <button class="tab" data-tab="fav" role="tab">我的收藏 (<span id="favCount">0</span>)</button>
  </nav>

  <section class="panel" id="filters">
    <div class="panel-head">
      <h2>选场景</h2>
      <span>卡池只从选中的场景里抽</span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="toggle-row">
      <div>
        <b>只看不露脸</b>
        <small>社恐 / 素颜 / 不想露脸也能出片</small>
      </div>
      <button class="switch" id="nofaceSwitch" role="switch" aria-checked="false" aria-label="只看不露脸"></button>
    </div>
  </section>

  <p class="pool-note" id="poolNote"></p>
  <main class="grid" id="grid"></main>

  <p class="footer-note">
    示范图均为 AI 生成内容（含AI生成内容），人物为虚拟形象，仅作姿势参考。<br />
    右下角小图是机位示意：圆点是人，相机图标是拍摄位置。
  </p>
</div>

<div class="cta-bar">
  <button class="cta" id="ctaDraw">抽一张 照着拍 <small id="ctaPool">卡池 39 张</small></button>
</div>

<div class="shuffle" id="shuffle" aria-hidden="true">
  <div class="deck"><div>?</div><div>?</div><div>?</div></div>
</div>

<div class="mask" id="mask" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const SCENES = ["咖啡店", "海边", "街头", "草地", "对镜", "情侣"];

// cam.a: 相机相对人物朝向的角度，0=正前，90=侧面，180=正后；cam.h: low / eye / high / top
const POSES = [
  { scene: "咖啡店", title: "窗边托腮看外面", noface: false, cam: { a: 45, h: "eye" },
    pose: "坐在靠窗的位置，手肘撑在桌上，指尖轻轻托住下巴，眼神看向窗外远处。",
    camera: "和桌面同高，从斜前方 45° 拍半身，把窗框一起收进画面。",
    tip: "手是“托”不是“撑”，下巴别压实；让窗光落在脸的一侧，自带氛围感。",
    fit: "有落地窗的咖啡店，下午两三点的柔光最好。" },
  { scene: "咖啡店", title: "双手捧杯只拍手", noface: true, cam: { a: 0, h: "top" },
    pose: "双手捧住咖啡杯放在桌面，袖口自然盖住一点手背。",
    camera: "站起来从斜上方 45° 往下拍，只框手、杯子和一点桌面。",
    tip: "拉花朝向镜头；手指放松微微交叠，比紧握更好看。",
    fit: "有拉花的拿铁、木质桌面，适合不想露脸的日常记录。" },
  { scene: "咖啡店", title: "吧台高脚凳侧坐", noface: false, cam: { a: 60, h: "eye" },
    pose: "侧身坐在高脚凳上，一只脚踩凳子横杠，另一条腿自然往下伸直。",
    camera: "蹲到腰部高度，从侧前方拍全身，竖构图留出地面。",
    tip: "往下伸的那条腿脚尖点地，腿会显长；双手搭在膝盖上别乱放。",
    fit: "有吧台和高脚凳的极简风咖啡店。" },
  { scene: "咖啡店", title: "推门而入回头看", noface: false, cam: { a: 150, h: "eye" },
    pose: "一只手推开店门，身体往里走，头回过来看镜头。",
    camera: "站在人身后斜侧方，平视拍全身，把门和招牌拍进去。",
    tip: "回头时只转头和肩，腰不要跟着扭；可以抓拍回头那一下的笑。",
    fit: "门口有绿植、木门或玻璃门的小店。" },
  { scene: "咖啡店", title: "低头翻书", noface: false, cam: { a: 30, h: "eye" },
    pose: "坐在桌前，书摊开拿在手里，微微低头看书，嘴角放松。",
    camera: "平视从斜前方拍半身，咖啡杯放在画面前景。",
    tip: "低头幅度小一点，别出双下巴；眼睛往下看书就够了。",
    fit: "安静的书店咖啡馆、靠窗座位。" },
  { scene: "咖啡店", title: "举杯只拍半张脸", noface: true, cam: { a: 20, h: "eye" },
    pose: "双手把杯子举到嘴边，像正要喝一口。",
    camera: "平视近拍，画面上沿切在鼻子下方，只留嘴唇、长发和手。",
    tip: "脸切掉一半反而更有故事感；头发拨到一侧露出脖子线条。",
    fit: "素颜或不想露全脸，又想要一点人物感的时候。" },
  { scene: "咖啡店", title: "背对镜头回眸", noface: false, cam: { a: 135, h: "eye" },
    pose: "背对镜头坐着，转头越过肩膀看向镜头，浅浅地笑。",
    camera: "在人身后斜 45° 平视拍半身，店内环境做背景。",
    tip: "肩膀放低、下巴贴近肩头，回眸的角度会更柔和。",
    fit: "环境好看的咖啡店，背景有层次的座位。" },

  { scene: "海边", title: "背影走向海", noface: true, cam: { a: 180, h: "low" },
    pose: "光脚朝海的方向慢慢走，手自然摆动，头发让风吹。",
    camera: "在人身后蹲低拍全身，海平线放在画面上三分之一处。",
    tip: "穿浅色长裙更出片；走慢一点，连拍挑裙摆飘起来的一张。",
    fit: "傍晚或阴天的柔光海边，不露脸首选。" },
  { scene: "海边", title: "张开手臂迎海风", noface: true, cam: { a: 180, h: "eye" },
    pose: "站在浅水边，背对镜头，双臂向两侧张开迎着海风。",
    camera: "在人身后平视拍全身，左右留白，让天空和海占大半画面。",
    tip: "红色、黄色这种亮色裙子在蓝色海面前特别跳。",
    fit: "晴天、海水颜色漂亮的海边。" },
  { scene: "海边", title: "坐沙滩抱膝", noface: false, cam: { a: 0, h: "low" },
    pose: "坐在沙滩上双手抱膝，下巴轻轻搁在膝盖上，看向镜头。",
    camera: "蹲到和她眼睛差不多高，正前方拍，背景是海和天空。",
    tip: "脚尖绷一点、膝盖并拢；逆光时让对方给脸补一点光。",
    fit: "日落前后的金色时段。" },
  { scene: "海边", title: "踢水回眸笑", noface: false, cam: { a: 120, h: "eye" },
    pose: "站在浅浪里抬脚踢水，同时回头看镜头笑。",
    camera: "侧后方平视拍全身，用连拍抓水花溅起来的瞬间。",
    tip: "踢的动作要大一点才有水花；裤腿卷起来别被打湿。",
    fit: "阳光好的夏天海边，浪不大的浅滩。" },
  { scene: "海边", title: "提裙走在浪边", noface: false, cam: { a: 90, h: "eye" },
    pose: "一只手轻轻提起裙摆，沿着浪花边缘走，低头看脚下的水。",
    camera: "在人的正侧面平视拍全身，跟着她一起走着拍。",
    tip: "提裙只提一点，手腕放松；低头时嘴角带笑。",
    fit: "长裙、雪纺裙，退潮后的湿沙滩。" },
  { scene: "海边", title: "草帽遮脸", noface: true, cam: { a: 0, h: "eye" },
    pose: "坐在野餐布上，双手拿大草帽挡在脸前。",
    camera: "平视正前方拍半身，草帽放在画面中心。",
    tip: "草帽挡住整张脸，只露头发和手；指尖捏帽檐更显手指细长。",

const H_LABEL = { low: "低机位", eye: "平视", high: "稍俯拍", top: "俯拍" };
function angleLabel(a) {
  if (a <= 10) return "正前方";
  if (a < 75) return `斜前 ${a}°`;
  if (a <= 105) return "侧面";
  if (a < 170) return "斜后方";
  return "正后方";
}

function camSvg(cam) {
  const cx = 30, cy = 30, r = 21;
  const rad = (cam.a * Math.PI) / 180;
  const x = cx + r * Math.sin(rad);
  const y = cy + r * Math.cos(rad);
  const rot = (Math.atan2(cy - y, cx - x) * 180) / Math.PI;
  const hColor = { low: "#5a9e6f", eye: "#5b7fc7", high: "#f0a04b", top: "#e8473c" }[cam.h];
  return `<svg viewBox="0 0 60 60" aria-label="机位示意：${H_LABEL[cam.h]} · ${angleLabel(cam.a)}">
    <circle cx="30" cy="30" r="21" fill="none" stroke="#eadfd8" stroke-width="1.5" stroke-dasharray="2 3"/>
    <path d="M30 30 L${(30 - 8).toFixed(1)} 50 A21 21 0 0 0 ${(30 + 8).toFixed(1)} 50 Z" fill="#fbe1dc" opacity=".9"/>
    <line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="30" y2="30" stroke="${hColor}" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="30" cy="30" r="6" fill="#2b2420"/>
    <path d="M27 35 L30 39 L33 35 Z" fill="#2b2420"/>
    <g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)})">
      <rect x="-6" y="-4.5" width="10" height="9" rx="2" fill="${hColor}"/>
      <path d="M4 -2.5 L8 -4.5 L8 4.5 L4 2.5 Z" fill="${hColor}"/>
    </g>
  </svg>`;
}

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const state = {
  tab: "all",
  scene: "全部",
  noface: false,
  favs: new Set(store.get("pose-favs", [])),
  lastId: null
};

const $ = (s) => document.querySelector(s);

function pool() {
  return POSES.filter((p) =>
    (state.tab === "all" || state.favs.has(p.id)) &&
    (state.scene === "全部" || p.scene === state.scene) &&
    (!state.noface || p.noface)
  );
}

function renderChips() {
  const list = ["全部", ...SCENES];
  $("#chips").innerHTML = list.map((s) => {
    const n = s === "全部" ? POSES.length : POSES.filter((p) => p.scene === s).length;
    return `<button class="chip ${state.scene === s ? "on" : ""}" data-scene="${s}">${s}<i>${n}</i></button>`;
  }).join("");
}

function cardHtml(p) {
  return `<button class="card" data-id="${p.id}" aria-label="${p.title}">
    <img src="${p.img}" alt="${p.title} 姿势示范（AI生成）" loading="lazy" />
    <span class="tag scene">${p.scene}</span>
    ${p.noface ? '<span class="tag noface">不露脸</span>' : ""}
    <span class="ai-mark">AI生成</span>
    <span class="title">${p.title}${state.favs.has(p.id) ? '<span class="heart">♥</span>' : ""}</span>
    <span class="mini-cam">${camSvg(p.cam)}</span>
  </button>`;
}

function render() {
  const list = pool();
  $("#favCount").textContent = state.favs.size;
  $("#nofaceCount").textContent = POSES.filter((p) => p.noface).length;
  $("#totalCount").textContent = POSES.length;
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.tab === state.tab));
  $("#nofaceSwitch").classList.toggle("on", state.noface);
  $("#nofaceSwitch").setAttribute("aria-checked", state.noface);
  renderChips();

  const where = state.tab === "fav" ? "我的收藏" : "当前卡池";
  $("#poolNote").innerHTML = `${where} <b>${list.length}</b> 张 · 点卡片看详情，或直接抽一张`;
  $("#ctaPool").textContent = `卡池 ${list.length} 张`;
  $("#ctaDraw").disabled = list.length === 0;

  $("#grid").innerHTML = list.length
    ? list.map(cardHtml).join("")
    : `<div class="empty"><b>♡</b>${state.tab === "fav" ? "还没有收藏，抽到喜欢的姿势点一下爱心吧" : "这个筛选下没有姿势，换个场景试试"}</div>`;
}

function openSheet(p) {
  state.lastId = p.id;
  const fav = state.favs.has(p.id);
  $("#sheet").innerHTML = `
    <div class="photo">
      <img src="${p.img}" alt="${p.title} 姿势示范（AI生成）" />
      <span class="tag scene">${p.scene}</span>
      ${p.noface ? '<span class="tag noface">不露脸</span>' : ""}
      <span class="angle">${H_LABEL[p.cam.h]} · ${angleLabel(p.cam.a)}</span>
      <span class="ai-mark">含AI生成内容</span>
      <span class="mini-cam">${camSvg(p.cam)}</span>
      <button class="close" data-close aria-label="关闭">×</button>
    </div>
    <div class="body">
      <h3 id="sheetTitle">${p.title}<span>No.${String(p.id).padStart(2, "0")}</span></h3>
      <div class="row"><em>摆法</em><div>${p.pose}</div></div>
      <div class="row"><em>机位</em><div>${p.camera}</div></div>
      <div class="row"><em>要点</em><div>${p.tip}</div></div>
      <div class="row"><em>适合<br>场景</em><div>${p.fit}</div></div>
      <div class="actions">
        <button class="fav ${fav ? "on" : ""}" data-fav="${p.id}" aria-label="收藏">${fav ? "♥" : "♡"}</button>
        <button class="again" data-again>再抽一张</button>
      </div>
      <p class="sheet-note">点空白处关闭 · 示范图为AI生成</p>
    </div>`;
  $("#mask").classList.add("show");
  const sheet = $("#sheet");
  sheet.style.animation = "none";
  void sheet.offsetWidth;
  sheet.style.animation = "";
  sheet.scrollTop = 0;
}

function closeSheet() {
  $("#mask").classList.remove("show");
}

function draw() {
  const list = pool();
  if (!list.length) return;
  const candidates = list.length > 1 ? list.filter((p) => p.id !== state.lastId) : list;
  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  closeSheet();
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return openSheet(pick);
  $("#shuffle").classList.add("show");
  setTimeout(() => {
    $("#shuffle").classList.remove("show");
    openSheet(pick);
  }, 750);
}

function toggleFav(id) {
  state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
  store.set("pose-favs", [...state.favs]);
  const btn = document.querySelector(`[data-fav="${id}"]`);
  if (btn) {
    const on = state.favs.has(id);
    btn.classList.toggle("on", on);
    btn.textContent = on ? "♥" : "♡";
  }
  render();
}

document.addEventListener("click", (e) => {
  const t = e.target;
  const tab = t.closest(".tab");
  if (tab) { state.tab = tab.dataset.tab; return render(); }
  const chip = t.closest(".chip");
  if (chip) { state.scene = chip.dataset.scene; return render(); }
  if (t.closest("#nofaceSwitch")) { state.noface = !state.noface; return render(); }
  const card = t.closest(".card");
  if (card) return openSheet(POSES.find((p) => p.id === +card.dataset.id));
  if (t.closest("#ctaDraw") || t.closest("#badgeDraw") || t.closest("[data-again]")) return draw();
  const fav = t.closest("[data-fav]");
  if (fav) return toggleFav(+fav.dataset.fav);
  if (t.closest("[data-close]") || t === $("#mask")) return closeSheet();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeSheet();
});

render();
</script>
